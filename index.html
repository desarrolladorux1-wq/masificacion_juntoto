<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masificación | Acceso</title>
  <link rel="stylesheet" href="../modulos/login/estilos_login.css?v=20260828-3">
  <link rel="stylesheet" href="login_adaptacion.css?v=20260928-1">
</head>
<body class="pagina-acceso">
  <main class="pagina-login">
    <section class="tarjeta-login" aria-label="Acceso a Masificación">
      <div class="panel-marca"><img class="logo-paulet" src="../img/logo_paulet.png" alt="Paulet"><img class="logo-fise" src="img/logo_fise.png" alt="FISE, Fondo de Inclusión Social Energético"></div>
      <div class="panel-formulario">
      <form class="formulario" id="formLogin" novalidate>
        <div class="encabezado"><h1>Bienvenido</h1></div>
        <label class="campo"><span class="solo-lectores">Usuario</span><span class="icono" aria-hidden="true">♙</span><input id="usuarioLogin" autocomplete="username" placeholder="Usuario" required></label>
        <label class="campo campo-clave"><span class="solo-lectores">Contraseña</span><span class="icono" aria-hidden="true">▣</span><input id="claveLogin" type="password" autocomplete="current-password" placeholder="Contraseña" required><button class="ver-clave" id="verClave" type="button" aria-label="Mostrar contraseña">◉</button></label>
        <p class="mensaje" id="mensajeLogin" role="alert"></p>
        <button class="boton-ingresar" type="submit">Ingresar</button>
      </form>
      <button class="enlace" id="mostrarRegistro" type="button">Crear usuario</button>
      <p class="ayuda">Usuarios iniciales: <b>masificacion</b>, <b>contratista</b>, <b>interventor</b> y <b>supervisor</b>. Contraseña: <b>123456</b>.</p>
      </div></section>
  </main>
  <dialog id="modalRegistro">
    <header><div><small>NUEVO ACCESO</small><h2>Crear usuario</h2></div><button type="button" aria-label="Cerrar">×</button></header>
    <form id="formRegistro">
      <label>Nombre completo<input id="nombreRegistro" placeholder="Nombre y apellido" required></label>
      <label>Usuario<input id="usuarioRegistro" placeholder="Ej. juan.perez" required></label>
      <label>Contraseña<input id="claveRegistro" type="password" minlength="6" placeholder="Mínimo 6 caracteres" required></label>
      <fieldset><legend>Módulo de acceso</legend><div class="roles" id="rolesRegistro"><button type="button" data-rol="masificacion">Masificación</button><button type="button" data-rol="contratista">Contratista</button><button type="button" data-rol="interventor">Interventor</button><button type="button" data-rol="supervisor">Supervisor PETROPERÚ</button></div></fieldset>
      <p class="mensaje" id="mensajeRegistro" role="alert"></p>
      <button class="principal" type="submit">Crear usuario</button>
    </form>
  </dialog>
  <script src="login.js"></script>
</body>
</html>
